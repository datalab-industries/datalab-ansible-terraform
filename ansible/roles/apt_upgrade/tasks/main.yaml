---
- name: Upgrade packages (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 86400

- name: Install unattended-upgrades (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Configure unattended-upgrades auto-reboot (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
    mode: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "02:00";

- name: Enable unattended-upgrades periodic runs (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Ubuntu's default timers run the upgrade at ~06:00, which leaves any required
# reboot waiting ~20h for the 02:00 reboot window above. Pull them forward so
# package lists refresh around midnight, upgrades install around 01:00, and the
# reboot (if needed) follows at 02:00.
- name: Create apt timer override directories (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.timer.d"
    state: directory
    mode: '0755'
  loop:
    - apt-daily
    - apt-daily-upgrade

- name: Override apt timers to run overnight (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.timer }}.timer.d/override.conf"
    mode: '0644'
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ item.time }}
      RandomizedDelaySec={{ item.delay }}
  loop:
    - { timer: apt-daily, time: '00:00:00', delay: '30m' }
    - { timer: apt-daily-upgrade, time: '01:00:00', delay: '15m' }
  register: apt_timer_overrides

- name: Enable apt timers (Ubuntu)
  become: true
  when: ansible_distribution == 'Ubuntu'
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    enabled: true
    state: started
    daemon_reload: "{{ apt_timer_overrides.changed }}"
  loop:
    - apt-daily
    - apt-daily-upgrade

# dnf treats missing repos as "nothing to upgrade", so a host that has lost its
# OS repos (e.g., an expired or deleted RHSM registration) upgrades only third-party
# packages like Docker and reports success; fail loudly instead
- name: List enabled dnf repos (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.command: dnf -q repolist --enabled
  register: dnf_repolist
  changed_when: false
  check_mode: false

- name: Check subscription-manager registration (RHEL)
  become: true
  when: ansible_distribution == 'RedHat'
  ansible.builtin.command: subscription-manager identity
  register: rhsm_identity
  changed_when: false
  failed_when: false
  check_mode: false

# Checking repo names is not enough: a host can still have e.g. frozen install-media
# repos called "baseos"/"appstream" enabled. Instead, require that the enabled repos
# offer a kernel at least as new as the newest installed one, which a working OS
# repo always does (the installed kernel came from it), but a stale one does not.
- name: Compare newest available and installed kernels (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.shell: |
    set -o pipefail
    installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' kernel-core | sort -V | tail -n1)
    available=$(dnf -q repoquery --available --latest-limit 1 --qf '%{VERSION}-%{RELEASE}' kernel-core | sort -V | tail -n1)
    newest=$(printf '%s\n%s\n' "$installed" "$available" | sort -V | tail -n1)
    echo "installed=$installed"
    echo "available=${available:-none}"
    if [ -n "$available" ] && [ "$newest" = "$available" ]; then echo "ok=true"; else echo "ok=false"; fi
  args:
    executable: /bin/bash
  register: dnf_kernel_check
  changed_when: false
  check_mode: false

# A semi-managed host may get its OS repos from a mirror without being
# registered, so registration only adds a hint to the message
- name: Fail if the OS repos cannot provide kernel updates (RedHat)
  when: ansible_os_family == 'RedHat'
  vars:
    kernel_check: "{{ dict(dnf_kernel_check.stdout_lines | map('split', '=', 1)) }}"
  ansible.builtin.assert:
    that:
      - kernel_check.ok == 'true'
    quiet: true
    fail_msg: >-
      The enabled dnf repositories on {{ inventory_hostname }} cannot provide OS updates:
      the newest kernel-core they offer ({{ kernel_check.available }}) is older than the
      newest installed one ({{ kernel_check.installed }}), so the repository the system
      was updated from is no longer available, or has stopped updating.
      {% if rhsm_identity.rc | default(0) != 0 %}The system is not registered with
      subscription-manager (`subscription-manager identity` failed); ask the server
      administrator to re-register it.{% endif %}
      Enabled repositories: {{ dnf_repolist.stdout_lines[1:] | join('; ') }}

- name: Upgrade packages (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.dnf:
    name: '*'
    state: latest  # noqa: package-latest

- name: Install dnf-automatic (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure dnf-automatic to apply updates (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: upgrade_type, value: 'security'}
    - { option: apply_updates, value: 'yes' }
    - { option: reboot, value: when-needed }

- name: Override dnf-automatic timer to run at 02:00 (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf-automatic.timer.d/override.conf
    mode: '0644'
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 02:00:00
      RandomizedDelaySec=0
  register: dnf_automatic_timer_override

- name: Enable dnf-automatic timer (RedHat)
  become: true
  when: ansible_os_family == 'RedHat'
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
    daemon_reload: "{{ dnf_automatic_timer_override.changed }}"
