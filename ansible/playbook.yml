---
- name: Probe whether bootstrap is needed
  hosts: all
  gather_facts: false
  tags: [setup, bootstrap]
  roles:
    - role: bootstrap_probe

- name: Bootstrap non-root ansible_user
  hosts: all
  # Facts are gathered below, so that hosts without a managed system are
  # skipped before trying to connect as root
  gather_facts: false
  tags: [setup, bootstrap]
  # Connect as root to create the target ansible_user before later plays
  # connect as it. No-op when target_ansible_user is already root, or
  # when the probe above showed the user can already log in. Play vars
  # outrank inventory host_vars, so this overrides them for this play.
  vars:
    ansible_user: root
    ansible_ssh_user: root
  pre_tasks:
    - name: Skip bootstrap when the system is managed externally
      ansible.builtin.meta: end_host
      # Defaulted inline: this play does not include the docker role, whose
      # defaults define manage_system
      when: not (manage_system | default(true))

    - name: Skip bootstrap when the target user can already log in
      ansible.builtin.meta: end_host
      # Defaulted for runs where the probe play was skipped, e.g. by tags
      when: not (bootstrap_needed | default(true))

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: bootstrap_user

- name: Create and maintain a datalab
  hosts: all
  vars:
    # app_url/api_url may carry an optional scheme and, for api_url, a root
    # path (e.g. example.org/api). Split them so that certificates and
    # server_name directives only ever see the bare hostname, and so that
    # nginx knows whether the API needs its own server block or a location
    # nested inside the app's.
    app_host: "{{ app_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"
    api_host: "{{ api_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"
    api_root_path: "{{ api_url | regex_replace('^https?://[^/]+', '') | regex_replace('^[^/]+', '') | regex_replace('/+$', '') }}"
  # Point all docker modules and CLI calls at the configured daemon; see
  # roles/docker/defaults/main.yml
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  pre_tasks:
    # Drop any SSH control socket from the bootstrap play so this play
    # connects fresh as the (possibly different) inventory ansible_user.
    - name: Reset SSH connection after bootstrap play
      ansible.builtin.meta: reset_connection

    - name: Look up docker user
      ansible.builtin.getent:
        database: passwd
        key: "{{ docker_user }}"
      tags: [always]

    - name: Set docker user facts
      ansible.builtin.set_fact:
        docker_user_uid: "{{ ansible_facts.getent_passwd[docker_user][1] }}"
        docker_user_home_dir: "{{ ansible_facts.getent_passwd[docker_user][4] }}"
      tags: [always]
  roles:
    - role: preflight
      name: Check if the system is ready for the playbook
      tags: [setup]
      when: manage_system
    - role: setup
      name: Run OS and disk set up tasks
      tags: [setup]
      when: manage_system
    - role: docker
      name: Install and configure Docker
      tags: [setup]
    - role: fail2ban
      name: Install and configure fail2ban
      tags: [setup]
      when: manage_system
    - role: ssh_hardening
      name: Disable password SSH and harden sshd
      tags: [setup, ssh]
      when: manage_system
    - role: ssl_first_run
      name: Run stripped down nginx and SSL for the first time
      tags: [setup, ssl]
      when: manage_nginx
    - role: datalab
      name: Build and launch datalab services
      tags: [setup, deploy]
    - role: extras
      name: Deploy any extras found in src/extras
      tags: [setup, extras]
    - role: nginx
      name: Launch nginx container with autorenewing certbot
      tags: [setup, nginx, maintenance, ssl]
      when: manage_nginx
    - role: borg
      name: Configure borg(matic) and remote backups
      tags: [borg]
    - role: monitoring
      name: Install and configure prometheus monitoring stack
      tags: [monitoring]

  tasks:
    - name: Keep all packages up-to-date
      ansible.builtin.include_role:
        name: apt_upgrade
        apply:
          tags: [maintenance]
      tags: [maintenance]
      when: manage_system
