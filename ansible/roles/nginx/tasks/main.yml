---
- name: Synchronize nginx files to remote
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: "{{ ansible_user_home_dir }}/nginx"
    delete: true

- name: Make directory for rendered templates
  ansible.builtin.file:
    path: "{{ ansible_user_home_dir }}/nginx/rendered/include"
    state: directory
    mode: "0755"

- name: Render templated datalab config
  ansible.builtin.template:
    src: nginx_datalab.conf.j2
    dest: "{{ ansible_user_home_dir }}/nginx/rendered/include/nginx_datalab.conf"
    mode: "0644"

- name: Render templated extras config
  ansible.builtin.template:
    src: nginx_extras.conf.j2
    dest: "{{ ansible_user_home_dir }}/nginx/rendered/include/nginx_extras.conf"
    mode: "0644"

- name: Render templated SSL config
  ansible.builtin.template:
    src: nginx_ssl.conf.j2
    dest: "{{ ansible_user_home_dir }}/nginx/rendered/nginx_ssl.conf"
    mode: "0644"

- name: Give docker user read access to synced nginx files
  when: docker_become and docker_shared_group | length > 0
  ansible.builtin.file:
    path: "{{ ansible_user_home_dir }}/nginx"
    group: "{{ docker_shared_group }}"
    mode: g+rX
    recurse: true

- name: Build nginx image
  become: "{{ docker_become }}"
  become_user: "{{ docker_user }}"
  community.docker.docker_image:
    name: datalab-nginx
    source: build
    state: present
    force_source: true
    build:
      path: "{{ ansible_user_home_dir }}/nginx"
      pull: true

- name: Launch nginx container
  become: "{{ docker_become }}"
  become_user: "{{ docker_user }}"
  community.docker.docker_container:
    name: datalab-nginx
    image: datalab-nginx
    network_mode: host
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart_policy: always
