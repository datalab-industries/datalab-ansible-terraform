---
argument_specs:
  main:
    short_description: Launch the nginx container with autorenewing certbot certificates
    description:
      - Generates the reverse proxy configuration for the app, the API and any extras,
        and launches nginx with a certbot sidecar that renews the certificates.
      - Skipped entirely when manage_nginx is false.
    options:
      api_url:
        type: str
        required: true
        description:
          - The URL where the datalab API is served.
          - Either its own subdomain (e.g. api.example.org), or the app's host with a root path (e.g. example.org/api), in which case nginx serves it as a sublocation and ROOT_PATH must be set in the datalab config.
      app_url:
        type: str
        required: true
        description:
          - The URL where the datalab web app is served, e.g. example.org.
          - Also used as the instance label in the monitoring metrics.
      extras:
        type: dict
        required: false
        description:
          - Additional services to reverse proxy, keyed by service name, each with a url and a port.
          - The containers themselves are defined in src/extras/docker-compose.yml.
      manage_nginx:
        type: bool
        required: false
        default: true
        description:
          - Whether the playbook manages nginx and its TLS certificates.
          - Set to false when a reverse proxy is managed externally, in which case the app and API containers still publish their ports for it to proxy to, and no certificate renewal is scheduled.
