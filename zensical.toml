# Documentation for the datalab-ansible-terraform template.
# Build with `make docs-build` or preview with `make docs`.
#
# Files in `docs/` and this config are overwritten by `sync-ansible-upstream.sh`.
# `CHECKLIST.md` is published here but owned by the deployment; `deployment-notes/`
# is deliberately not published, so deployments can write notes that stay local.

[project]
site_name = "Deploying datalab"
site_url = "https://datalab-industries.github.io/datalab-ansible-terraform/"
site_description = "Ansible playbooks for deploying and maintaining a datalab instance."
site_author = "datalab industries ltd."

copyright = "Copyright &copy; 2026 datalab industries ltd."

repo_url = "https://github.com/datalab-industries/datalab-ansible-terraform"
repo_name = "datalab-industries/datalab-ansible-terraform"

docs_dir = "docs"
site_dir = "site"

edit_uri = "edit/main/docs/"

# The nav follows the order a deployment happens in, grouped into tabs as in the
# datalab user guide:
#
#   Getting started: install, configure, deploy. Read in order.
#   Running an instance: keeping it up to date, and the checklist.
#   Features: optional extras. Each page stands alone.
#   Reference: the variables, deployment notes and the legacy Terraform plans.
#
# The Variables page is generated from the roles' argument specs by `make docs`.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Configuration" = "configuration.md" },
    { "Deploying" = "deployment.md" },
  ] },
  { "Running an instance" = [
    { "Updating" = "updating.md" },
    { "Deployment checklist" = "checklist.md" },
    { "Multiple deployments" = "dlmeta.md" },
  ] },
  { "Features" = [
    { "Overview" = "features.md" },
    { "Backups" = "backups.md" },
    { "Monitoring" = "monitoring.md" },
    { "Emails for failed cron jobs" = "cron-email.md" },
    { "ChemInventory syncing" = "cheminventory.md" },
    { "Plugins" = "plugins.md" },
    { "Additional containers" = "extras.md" },
    { "Rootless Docker and managed hosts" = "managed-hosts.md" },
    { "Vault password with Bitwarden" = "bitwarden.md" },
  ] },
  { "Reference" = [
    { "Variables" = "reference/index.md" },
    { "Deployment notes" = "project-docs.md" },
    { "Cloud provisioning (legacy)" = "terraform.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
# The classic (Material for MkDocs) look, so that the styling of the main datalab
# documentation and the user guide in `stylesheets/extra.css` carries over.
variant = "classic"
language = "en"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Geist"
code = "Iosevka Web"

# Colours, header and cards match the main datalab documentation at
# docs.datalab-org.io and the user guide at guide.datalab-org.io: a custom primary
# colour, defined in `stylesheets/extra.css`, taken from the datalab logo.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "brown"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "brown"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/datalab-industries/datalab-ansible-terraform"

[[project.extra.social]]
icon = "fontawesome/brands/slack"
link = "https://join.slack.com/t/datalab-world/shared_invite/zt-2h58ev3pc-VV496~5je~QoT2TgFIwn4g"

# Defaults, plus snippets rooted at the repository so that pages can include
# real files (e.g. the example inventory) rather than a copy that can drift.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
